<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>鎮山工程 水電靠模板產生器</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#171b24;--bg3:#1e2333;
  --border:#2a3045;--border-hi:#3d4f72;
  --accent:#4f8ef7;--accent2:#7dd3c0;
  --text:#e8ecf4;--text2:#8a94a8;--text3:#5a6278;
  --danger:#e06060;--success:#5cb88a;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans TC',sans-serif;
  --rad:6px;--rad-lg:10px;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px 80px}
.container{width:100%;max-width:920px}
header{margin-bottom:36px}
.logo{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
h1{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
h1 span{color:var(--accent2)}
.subtitle{margin-top:8px;font-size:14px;color:var(--text2);line-height:1.6}

.rule-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:28px}
.rule-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rad-lg);
  padding:14px 18px;display:flex;align-items:center;gap:12px}
.rule-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rule-dot.inner{background:var(--accent)}.rule-dot.outer{background:var(--accent2)}
.rule-label{font-size:13px;color:var(--text2);font-family:var(--mono);line-height:1.5}
.rule-label strong{color:var(--text);font-weight:500;display:block}

.proj-section{margin-bottom:20px}
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--text3);
  text-transform:uppercase;margin-bottom:8px}
.proj-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proj-row input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--rad);color:var(--text);font-family:var(--mono);font-size:14px;
  padding:9px 12px;outline:none;transition:border-color .15s,background .15s}
.proj-row input[type=text]:focus{border-color:var(--accent);background:#1c2235}
.proj-row input[type=text]::placeholder{color:var(--text3)}
.fname-preview{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--text2)}
.fname-preview span{color:var(--accent2)}

/* Global R input */
.global-r-bar{
  display:flex;align-items:center;gap:12px;
  background:var(--bg2);border:1px solid var(--border-hi);
  border-radius:var(--rad-lg);padding:12px 18px;margin-bottom:20px;
}
.global-r-bar label{font-family:var(--mono);font-size:12px;color:var(--text2);white-space:nowrap}
.global-r-bar input[type=number]{
  width:110px;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--rad);color:var(--text);font-family:var(--mono);font-size:14px;
  padding:7px 10px;outline:none;transition:border-color .15s;
  -moz-appearance:textfield;
}
.global-r-bar input[type=number]::-webkit-inner-spin-button,
.global-r-bar input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
.global-r-bar input[type=number]:focus{border-color:var(--accent)}
.btn-apply{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--rad);
  font-family:var(--mono);font-size:12px;cursor:pointer;
  background:none;border:1px solid var(--border-hi);color:var(--text2);
  transition:all .15s;white-space:nowrap;
}
.btn-apply:hover{border-color:var(--accent2);color:var(--accent2);background:#1a2e2a}
.global-r-bar .hint{font-family:var(--mono);font-size:11px;color:var(--text3);flex:1}

.table-header{display:grid;grid-template-columns:28px 1fr 1fr 1fr 130px 130px 32px;
  gap:8px;padding:0 4px 8px;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;color:var(--text3);text-transform:uppercase;
  border-bottom:1px solid var(--border);margin-bottom:8px}

.rows{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.row{display:grid;grid-template-columns:28px 1fr 1fr 1fr 130px 130px 32px;
  gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--rad);padding:8px 4px;transition:border-color .15s;
  animation:rowIn .18s ease}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.row:hover{border-color:var(--border-hi)}
.row-num{font-family:var(--mono);font-size:11px;color:var(--text3);text-align:center}
.row input[type=number]{width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--rad);color:var(--text);font-family:var(--mono);font-size:14px;
  padding:7px 10px;outline:none;transition:border-color .15s,background .15s;
  -moz-appearance:textfield}
.row input[type=number]::-webkit-inner-spin-button,
.row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
.row input[type=number]:focus{border-color:var(--accent);background:#1c2235}
.row input[type=number]::placeholder{color:var(--text3)}
.row input[type=number].r-input{border-color:var(--border-hi)}
.row input[type=number].r-input:focus{border-color:var(--accent2)}
.calc-cell{font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.7;padding:0 4px}
.calc-cell .iv{color:var(--accent)}.calc-cell .ov{color:var(--accent2)}
.calc-cell .err{color:var(--danger)}
.btn-del{background:none;border:1px solid transparent;border-radius:var(--rad);
  color:var(--text3);cursor:pointer;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  transition:color .15s,border-color .15s,background .15s}
.btn-del:hover{color:var(--danger);border-color:var(--danger);background:#2a1a1a}

.actions{display:flex;gap:10px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;
  border-radius:var(--rad);font-family:var(--mono);font-size:13px;cursor:pointer;
  transition:all .15s;border:1px solid;font-weight:400;letter-spacing:.05em}
.btn-add{background:none;border-color:var(--border-hi);color:var(--text2)}
.btn-add:hover{border-color:var(--accent);color:var(--accent);background:#1a2235}
.btn-gen{background:var(--accent);border-color:var(--accent);color:#fff;
  flex:1;justify-content:center;font-weight:500}
.btn-gen:hover{background:#6fa0ff;border-color:#6fa0ff}
.btn-gen:active{transform:scale(.98)}

.output{display:none}
.output.visible{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.output-title{font-family:var(--mono);font-size:11px;letter-spacing:.15em;
  color:var(--text3);text-transform:uppercase;margin-bottom:12px}
.file-item{display:flex;align-items:center;gap:14px;background:var(--bg2);
  border:1px solid var(--border);border-radius:var(--rad-lg);padding:16px 20px}
.file-icon{font-family:var(--mono);font-size:10px;color:var(--text3);
  background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:3px 6px;flex-shrink:0}
.file-info{flex:1}
.file-name{font-family:var(--mono);font-size:15px;color:var(--text);margin-bottom:4px}
.file-desc{font-size:12px;color:var(--text2)}
.file-desc .iv{color:var(--accent)}.file-desc .ov{color:var(--accent2)}
.btn-dl-main{display:inline-flex;align-items:center;gap:8px;padding:9px 22px;
  border-radius:var(--rad);background:var(--accent);border:1px solid var(--accent);
  color:#fff;font-family:var(--mono);font-size:13px;cursor:pointer;
  text-decoration:none;font-weight:500;transition:all .15s;flex-shrink:0}
.btn-dl-main:hover{background:#6fa0ff;border-color:#6fa0ff}

.preview-wrap{margin-top:28px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--rad-lg);overflow:hidden}
.preview-top{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:11px;color:var(--text3);
  letter-spacing:.1em;text-transform:uppercase}
#preview-canvas{display:block;background:#0b0e14;width:100%}

.notice{margin-top:16px;background:var(--bg2);border:1px solid var(--border-hi);
  border-radius:var(--rad);padding:12px 16px;font-family:var(--mono);font-size:12px;
  color:var(--text2);line-height:1.7}
.notice strong{color:var(--accent2)}

.statusbar{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--text3);
  display:flex;align-items:center;gap:8px}
.statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:none}
.statusbar.ok .dot{display:block}

@media(max-width:640px){
  .table-header,.row{grid-template-columns:24px 1fr 1fr 1fr 28px}
  .table-header .col-inner,.row .calc-inner,
  .table-header .col-outer,.row .calc-outer{display:none}
  .proj-row{grid-template-columns:1fr}
  .rule-strip{grid-template-columns:1fr}
  .actions{flex-wrap:wrap}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">CAD Tooling / Frame Generator</div>
    <h1>鎮山工程 <span>水電靠模板</span>產生器</h1>
    <p class="subtitle">輸入基準尺寸與 R 角，所有框架合併成單一 .dxf 檔案</p>
  </header>

  <div class="rule-strip">
    <div class="rule-card">
      <div class="rule-dot inner"></div>
      <div class="rule-label"><strong>內匡</strong>基準 +25 四邊，圓角 R（自訂）</div>
    </div>
    <div class="rule-card">
      <div class="rule-dot outer"></div>
      <div class="rule-label"><strong>外匡</strong>基準 +105 四邊，直角矩形</div>
    </div>
  </div>

  <div class="proj-section">
    <div class="section-label">工程資訊</div>
    <div class="proj-row">
      <input type="text" id="proj-name" placeholder="工程編號（例：B820）" oninput="updateFname()"/>
      <input type="text" id="proj-num"  placeholder="工程區（例：6BG.6BB）" oninput="updateFname()"/>
    </div>
    <div class="fname-preview">檔案名稱：<span id="fname-display">請輸入工程資訊</span></div>
  </div>

  <div class="global-r-bar">
    <label>統一 R 角</label>
    <input type="number" id="global-r" placeholder="例：25" min="0" step="0.1"/>
    <button class="btn-apply" onclick="applyGlobalR()">套用至全部列</button>
    <span class="hint">套用後仍可對各列單獨修改</span>
  </div>

  <div class="table-header">
    <div>#</div><div>基準 W</div><div>基準 H</div><div>R 角</div>
    <div class="col-inner">內匡結果</div>
    <div class="col-outer">外匡結果</div>
    <div></div>
  </div>
  <div class="rows" id="rows"></div>
  <div class="actions">
    <button class="btn btn-add" onclick="addRow()">＋ 新增一組</button>
    <button class="btn btn-gen" id="btn-gen" onclick="generate()">▶ 產生並下載 DXF</button>
  </div>

  <div class="output" id="output">
    <div class="output-title">產生結果</div>
    <div id="file-list"></div>
    <div class="preview-wrap" id="preview-wrap" style="display:none">
      <div class="preview-top"><span>全部框架預覽</span><span id="prev-info"></span></div>
      <canvas id="preview-canvas" height="340"></canvas>
    </div>
  </div>

  <div class="notice">
    <strong>關於 DWG：</strong>產生的 .dxf 用 AutoCAD 開啟後，「另存新檔」選 .dwg 即可。內容完全相同。
  </div>
  <div class="statusbar" id="statusbar">
    <div class="dot"></div>
    <span id="status-text">就緒</span>
  </div>
</div>

`;

const BULGE = 0.41421356237309503; // tan(pi/8), exact 90-degree arc
let rowCount = 0;
let lastFrames = [];

// ── Group code formatter (right-aligned, exactly like ezdxf) ──
function g(code, value) {
  const c = String(code).padStart(3, ' ');
  return c + '\n' + value + '\n';
}

function fmt(n) {
  return Number.isInteger(n) ? n.toFixed(1) : String(n);
}

// ── DXF entity builder ──
function buildDXF(frames) {
  let entities = '';
  let handle = 0x50;
  let xOff = 0;
  const GAP = 50;

  frames.forEach(({w, h, r}) => {
    const iw = w+25, ih = h+25;
    const ow = w+105, oh = h+105;
    const cx = xOff + ow/2, cy = 0;

    // OUTER: plain rectangle
    entities += g(0,'LWPOLYLINE');
    entities += g(5, handle.toString(16).toUpperCase()); handle++;
    entities += g(330,'17');
    entities += g(100,'AcDbEntity');
    entities += g(8,'OUTER');
    entities += g(100,'AcDbPolyline');
    entities += g(90,'4');
    entities += g(70,'1');
    [[cx-ow/2,cy-oh/2],[cx+ow/2,cy-oh/2],[cx+ow/2,cy+oh/2],[cx-ow/2,cy+oh/2]].forEach(([x,y]) => {
      entities += g(10, fmt(x));
      entities += g(20, fmt(y));
    });

    // INNER: rounded rectangle with bulge on arc-start vertices
    const iPts = [
      [cx-iw/2+r, cy-ih/2,   0],
      [cx+iw/2-r, cy-ih/2,   BULGE],
      [cx+iw/2,   cy-ih/2+r, 0],
      [cx+iw/2,   cy+ih/2-r, BULGE],
      [cx+iw/2-r, cy+ih/2,   0],
      [cx-iw/2+r, cy+ih/2,   BULGE],
      [cx-iw/2,   cy+ih/2-r, 0],
      [cx-iw/2,   cy-ih/2+r, BULGE],
    ];
    entities += g(0,'LWPOLYLINE');
    entities += g(5, handle.toString(16).toUpperCase()); handle++;
    entities += g(330,'17');
    entities += g(100,'AcDbEntity');
    entities += g(8,'INNER');
    entities += g(100,'AcDbPolyline');
    entities += g(90,'8');
    entities += g(70,'1');
    iPts.forEach(([x,y,b]) => {
      entities += g(10, fmt(x));
      entities += g(20, fmt(y));
      if (b) entities += g(42, String(b));
    });

    // TEXT label
    const lx = cx - ow/2, ly = cy - oh/2 - 12;
    const wl = Number.isInteger(w)?w:w, hl = Number.isInteger(h)?h:h, rl = Number.isInteger(r)?r:r;
    entities += g(0,'TEXT');
    entities += g(5, handle.toString(16).toUpperCase()); handle++;
    entities += g(330,'17');
    entities += g(100,'AcDbEntity');
    entities += g(8,'LABEL');
    entities += g(100,'AcDbText');
    entities += g(10, fmt(lx));
    entities += g(20, fmt(ly));
    entities += g(30,'0.0');
    entities += g(40,'8.0');
    entities += g(1, `${wl}x${hl} R${rl}`);
    entities += g(100,'AcDbText');

    xOff += ow + GAP;
  });

  return (
    DXF_HEADER +
    '  0\nSECTION\n  2\nENTITIES\n' +
    entities +
    '  0\nENDSEC\n' +
    DXF_OBJECTS
  );
}

// ── UI ──
function updateFname() {
  const n   = document.getElementById('proj-name').value.trim();
  const num = document.getElementById('proj-num').value.trim();
  const el  = document.getElementById('fname-display');
  const parts = [n, num].filter(Boolean);
  const name = (parts.join('-') || 'frame') + '.dxf';
  el.textContent = name;
  el.style.color = parts.length ? 'var(--accent2)' : 'var(--text3)';
}

function getFilename() {
  const n   = document.getElementById('proj-name').value.trim();
  const num = document.getElementById('proj-num').value.trim();
  const parts = [n, num].filter(Boolean);
  return (parts.join('-') || 'frame') + '.dxf';
}

function applyGlobalR() {
  const r = document.getElementById('global-r').value;
  if (r === '') return;
  document.querySelectorAll('[id^="row-"]').forEach(row => {
    const id = row.id.replace('row-','');
    const el = document.getElementById('r-' + id);
    if (el) { el.value = r; updateCalc(id); }
  });
  setStatus(`已將全部列的 R 角設為 ${r}`, true);
}

function addRow(w, h, r) {
  rowCount++;
  const id = rowCount;
  // inherit global R if set and r not provided
  const globalR = document.getElementById('global-r').value;
  const rVal = (r !== undefined && r !== null) ? r : (globalR !== '' ? globalR : '');
  const div = document.createElement('div');
  div.className = 'row'; div.id = 'row-' + id;
  div.innerHTML = `
    <div class="row-num">${id}</div>
    <input type="number" id="w-${id}" placeholder="200" value="${w||''}" min="1" step="0.1"/>
    <input type="number" id="h-${id}" placeholder="300" value="${h||''}" min="1" step="0.1"/>
    <input type="number" id="r-${id}" class="r-input" placeholder="25" value="${rVal}" min="0" step="0.1"/>
    <div class="calc-cell" id="ci-${id}">—</div>
    <div class="calc-cell" id="co-${id}">—</div>
    <button class="btn-del" onclick="removeRow(${id})" title="刪除">✕</button>
  `;
  document.getElementById('rows').appendChild(div);
  ['w','h','r'].forEach(k => document.getElementById(`${k}-${id}`).addEventListener('input', () => updateCalc(id)));
  if (w && h) updateCalc(id);
}

function updateCalc(id) {
  const w = parseFloat(document.getElementById('w-'+id)?.value);
  const h = parseFloat(document.getElementById('h-'+id)?.value);
  const r = parseFloat(document.getElementById('r-'+id)?.value);
  const ci = document.getElementById('ci-'+id);
  const co = document.getElementById('co-'+id);
  if (!ci) return;
  if (isNaN(w)||isNaN(h)) { ci.innerHTML='—'; co.innerHTML='—'; return; }
  const iw=+(w+25).toFixed(3), ih=+(h+25).toFixed(3);
  const ow=+(w+105).toFixed(3), oh=+(h+105).toFixed(3);
  const rLabel = (!isNaN(r)&&r>=0) ? `R${r}` : '<span class="err">缺R值</span>';
  ci.innerHTML = `<span class="iv">${iw}×${ih}</span><br>${rLabel}`;
  co.innerHTML = `<span class="ov">${ow}×${oh}</span><br>直角`;
}

function removeRow(id) {
  const el = document.getElementById('row-'+id);
  if (el) { el.style.opacity='0'; el.style.transform='translateX(8px)'; el.style.transition='all .15s'; setTimeout(()=>el.remove(),150); }
}

function generate() {
  const rows = document.querySelectorAll('[id^="row-"]');
  if (!rows.length) { setStatus('請先新增尺寸', false); return; }

  const frames = [];
  let errors = 0;
  rows.forEach(row => {
    const id = row.id.replace('row-','');
    const w = parseFloat(document.getElementById('w-'+id)?.value);
    const h = parseFloat(document.getElementById('h-'+id)?.value);
    const r = parseFloat(document.getElementById('r-'+id)?.value);
    const maxR = Math.min(w+25, h+25) / 2;
    const valid = !isNaN(w)&&!isNaN(h)&&w>0&&h>0&&!isNaN(r)&&r>=0&&r<=maxR;
    if (!valid) {
      errors++;
      row.style.borderColor = 'var(--danger)';
      setTimeout(() => row.style.borderColor = '', 1400);
      return;
    }
    frames.push({w, h, r});
  });

  if (!frames.length) { setStatus('沒有有效的尺寸資料，請確認輸入', false); return; }

  const fname = getFilename();

  try {
    const dxf = buildDXF(frames);
    const blob = new Blob([dxf], {type:'application/dxf'});
    const url  = URL.createObjectURL(blob);

    // File result card
    const fileList = document.getElementById('file-list');
    fileList.innerHTML = '';
    const desc = frames.map(f =>
      `<span class="iv">${f.w+25}×${f.h+25}</span> R${f.r} / <span class="ov">${f.w+105}×${f.h+105}</span>`
    ).join('&nbsp;&nbsp;|&nbsp;&nbsp;');
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `
      <div class="file-icon">.DXF</div>
      <div class="file-info">
        <div class="file-name">${fname}</div>
        <div class="file-desc">${frames.length} 組框架 — ${desc}</div>
      </div>
      <a class="btn-dl-main" href="${url}" download="${fname}">⬇ 下載</a>
    `;
    fileList.appendChild(item);

    // Preview
    lastFrames = frames;
    document.getElementById('preview-wrap').style.display = 'block';
    document.getElementById('prev-info').textContent = `${frames.length} 組`;
    drawPreview(frames);
    document.getElementById('output').classList.add('visible');

    // Auto-trigger download
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

    setStatus(`已產生 ${fname}，${frames.length} 組框架${errors?' ('+errors+' 列跳過)':''}`, true);
  } catch(e) {
    setStatus('產生失敗：' + e.message, false);
    console.error(e);
  }
}

function drawPreview(frames) {
  const canvas = document.getElementById('preview-canvas');
  const ctx = canvas.getContext('2d');
  const CW = canvas.offsetWidth || 860;
  canvas.width = CW; canvas.height = 340;
  ctx.clearRect(0,0,CW,340);
  if (!frames.length) return;

  const GAP = 50;
  const totalW = frames.reduce((s,f)=>s+(f.w+105),0) + GAP*(frames.length-1);
  const maxH   = Math.max(...frames.map(f=>f.h+105));
  const pad = 50;
  const scale = Math.min((CW-pad*2)/totalW, (340-pad*2-20)/maxH);
  let xOff = 0;
  const startX = CW/2 - totalW*scale/2;

  frames.forEach(({w,h,r}) => {
    const ow=w+105, oh=h+105, iw=w+25, ih=h+25;
    const cx = startX + (xOff + ow/2)*scale;
    const cy = 340/2 + 10;

    function drawR(rw,rh,rx,color,lw) {
      const x=cx-rw*scale/2, y=cy-rh*scale/2, rr=rx*scale;
      ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=lw;
      if (rx>0) {
        ctx.moveTo(x+rr,y); ctx.lineTo(x+rw*scale-rr,y);
        ctx.arcTo(x+rw*scale,y,x+rw*scale,y+rr,rr);
        ctx.lineTo(x+rw*scale,y+rh*scale-rr);
        ctx.arcTo(x+rw*scale,y+rh*scale,x+rw*scale-rr,y+rh*scale,rr);
        ctx.lineTo(x+rr,y+rh*scale);
        ctx.arcTo(x,y+rh*scale,x,y+rh*scale-rr,rr);
        ctx.lineTo(x,y+rr);
        ctx.arcTo(x,y,x+rr,y,rr); ctx.closePath();
      } else { ctx.rect(x,y,rw*scale,rh*scale); }
      ctx.stroke();
    }

    drawR(ow,oh,0,'#7dd3c0',1.5);
    drawR(iw,ih,r,'#4f8ef7',1.5);
    ctx.font = "10px 'IBM Plex Mono',monospace";
    ctx.fillStyle='#4f8ef7';
    ctx.fillText(`${iw}×${ih} R${r}`, cx-iw*scale/2, cy-ih*scale/2-5);
    ctx.fillStyle='#7dd3c0';
    ctx.fillText(`${ow}×${oh}`, cx-ow*scale/2, cy+oh*scale/2+14);
    xOff += ow + GAP;
  });
}

function setStatus(msg, ok) {
  document.getElementById('status-text').textContent = msg;
  document.getElementById('statusbar').classList.toggle('ok', ok);
}

window.addEventListener('resize', () => { if (lastFrames.length) drawPreview(lastFrames); });

addRow(200, 300, 25);
addRow(150, 250, 20);
setStatus('就緒', true);
</script>
